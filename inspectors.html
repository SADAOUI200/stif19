<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>إدارة المفتشين</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="loader-overlay" id="loaderOverlay"><div class="spinner"></div></div>
<div id="nav"></div>
<div class="container">
  <div class="page-header"><h2>🔍 <span>إدارة المفتشين</span></h2><span class="badge badge-inspector" id="cnt"></span></div>

  <div class="card fade-in" id="formCard">
    <div class="card-title" id="formTitle">➕ إضافة مفتش</div>
    <form id="form">
      <div class="form-grid">
        <div class="form-group"><label>الاسم الكامل <span class="req">*</span></label><input id="fName" required /></div>
        <div class="form-group"><label>التخصص <span class="req">*</span></label><select id="specialty" required></select></div>
        <div class="form-group"><label>المرحلة <span class="req">*</span></label><select id="stage" required></select></div>
        <div class="form-group"><label>الرتبة الوظيفية</label><select id="rank"></select></div>
        <div class="form-group"><label>رقم الهاتف (اختياري)</label><input type="tel" id="phone" /></div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" onclick="resetForm()">↺ مسح</button>
        <button type="submit" class="btn btn-accent" id="saveBtn">💾 حفظ المفتش</button>
      </div>
    </form>
  </div>

  <div class="card fade-in">
    <div class="card-title">📋 قائمة المفتشين</div>
    <div class="search-grid">
      <input type="search" id="qName" placeholder="بحث بالاسم..." oninput="render()" />
      <input type="search" id="qSpec" placeholder="بحث بالتخصص..." oninput="render()" />
      <select id="qStage" onchange="render()"></select>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>#</th><th>الاسم</th><th>التخصص</th><th>المرحلة</th><th>الرتبة</th><th>الهاتف</th><th id="thAct">إجراءات</th></tr></thead>
      <tbody id="body"></tbody>
    </table></div>
  </div>
</div>
<script src="config.js"></script>
<script src="core.js"></script>
<script>
  let all = [], editId = null, ME;
  const CAN_EDIT = can('inspectors', 'edit'), CAN_DEL = can('inspectors', 'delete'), CAN_ADD = can('inspectors', 'add');
  const actCell = id => (CAN_EDIT || CAN_DEL) ? `<td class="action-btns">${CAN_EDIT ? `<button class="btn btn-primary btn-sm" onclick="edit('${esc(id)}')">📝</button>` : ''}${CAN_DEL ? `<button class="btn btn-danger btn-sm" onclick="del('${esc(id)}')">🗑️</button>` : ''}</td>` : '';
  const val = id => document.getElementById(id).value.trim();

  async function load() {
    showLoader();
    try { all = (await listMany(['inspectors'])).inspectors; render(); }
    catch (e) { showError(e.message); }
    hideLoader();
  }
  function render() {
    const n = qName.value.toLowerCase(), s = qSpec.value.toLowerCase(), st = qStage.value;
    const rows = all.filter(i => i.name.toLowerCase().includes(n) && i.specialty.toLowerCase().includes(s) && (!st || i.stage === st));
    cnt.textContent = rows.length + ' مفتش';
    body.innerHTML = rows.length ? rows.map((i, k) => `
      <tr><td>${k + 1}</td><td><strong>${esc(i.name)}</strong></td><td>${esc(i.specialty)}</td><td>${esc(i.stage)}</td>
      <td>${esc(i.rank) || '-'}</td><td>${esc(i.phone) || '-'}</td>
      ${actCell(i.id)}</tr>`).join('')
      : '<tr><td colspan="7" class="empty-state"><span class="icon">🔍</span>لا يوجد مفتشون</td></tr>';
  }
  function edit(id) {
    const i = all.find(x => x.id === id); if (!i) return;
    editId = id; formCard.style.display = ''; fName.value = i.name; specialty.value = i.specialty; stage.value = i.stage;
    rank.value = i.rank; phone.value = i.phone;
    formTitle.textContent = '📝 تعديل مفتش'; saveBtn.textContent = '💾 حفظ التعديلات';
    scrollTo({ top: 0, behavior: 'smooth' });
  }
  function resetForm() {
    editId = null; form.reset(); formTitle.textContent = '➕ إضافة مفتش'; saveBtn.textContent = '💾 حفظ المفتش';
    formCard.style.display = CAN_ADD ? '' : 'none';
  }
  form.onsubmit = async e => {
    e.preventDefault();
    const data = { name: val("fName"), specialty: val('specialty'), stage: val('stage'), rank: val('rank'), phone: val('phone') };
    try {
      showLoader();
      await (editId ? api('update', { sheet: 'inspectors', id: editId, data }) : api('insert', { sheet: 'inspectors', data }));
      showSuccess(editId ? 'تم التعديل' : 'تمت الإضافة'); resetForm(); await load();
    } catch (ex) { showError(ex.message); }
    hideLoader();
  };
  async function del(id) {
    if (!confirm('حذف هذا المفتش؟ (الزيارات المسجلة لا تُحذف)')) return;
    try { showLoader(); await api('delete', { sheet: 'inspectors', id }); await load(); }
    catch (e) { showError(e.message); }
    hideLoader();
  }
  fillSelect(specialty, SPECIALTIES, '-- اختر التخصص --');
  fillSelect(stage, LEVELS, '-- اختر المرحلة --');
  fillSelect(rank, INSPECTOR_RANKS, '-- اختر الرتبة --');
  fillSelect(qStage, LEVELS, '-- كل المراحل --');
  ME = initPage(null, ['inspectors', 'view']);
  if (ME) { if (!CAN_EDIT && !CAN_DEL) thAct.style.display = 'none'; formCard.style.display = CAN_ADD ? '' : 'none'; load(); }
</script>
</body>
</html>
