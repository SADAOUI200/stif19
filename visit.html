<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>إدارة الزيارات التفتيشية</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="loader-overlay" id="loaderOverlay"><div class="spinner"></div></div>
<div id="nav"></div>
<div class="container">

  <div class="card fade-in" id="whoCard" style="display:none;">
    <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap;">
      <div style="font-size:2.4rem;">👤</div>
      <div>
        <div id="whoName" style="font-size:1.6rem;font-weight:800;color:var(--accent-light);"></div>
        <div id="whoMeta" style="color:var(--text-muted);margin-top:.2rem;"></div>
      </div>
      <a href="reports.html" class="btn btn-primary btn-sm" style="margin-right:auto;">🖨️ تقرير مقاطعتي</a>
    </div>
  </div>

  <div class="card fade-in" id="formCard">
    <div class="card-title" id="formTitle">✏️ تسجيل زيارة جديدة</div>
    <div class="hint" id="noMun" style="display:none;">لا توجد بلديات مسجّلة — يضيفها المدير من صفحة الإعدادات.</div>
    <form id="visitForm">
      <div class="form-grid">
        <div class="form-group" id="gStage"><label>المرحلة التعليمية</label><select id="stageSel" required></select></div>
        <div class="form-group"><label>البلدية</label><select id="munSel" required></select></div>
        <div class="form-group"><label>المؤسسة</label><select id="instSel" required disabled></select></div>
        <div class="form-group" id="gInsp"><label>المفتش</label><select id="inspSel" required disabled></select></div>
        <div class="form-group" id="gSpec"><label>التخصص</label><input id="specialty" readonly /></div>
        <div class="form-group"><label>اسم المعني بالزيارة</label><input id="visitee" required /></div>
        <div class="form-group"><label>الرتبة</label><input id="rank" list="rankList" autocomplete="off" /><datalist id="rankList"></datalist></div>
        <div class="form-group"><label>الدرجة</label><input id="grade" /></div>
        <div class="form-group"><label>نوع الزيارة</label><select id="visitType"></select></div>
        <div class="form-group"><label>تاريخ الزيارة</label><input type="date" id="vDate" required /></div>
        <div class="form-group"><label>العقوبات / الإجازات</label><select id="penalty"></select></div>
        <div class="form-group"><label>النقطة (من 20)</label><input type="number" id="score" step="0.25" min="0" max="20" /></div>
        <div class="form-group"><label>الموسم</label><select id="season"></select></div>
        <div class="form-group full-width"><label>الملاحظة</label><select id="note"></select></div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" id="cancelBtn" style="display:none;" onclick="resetForm()">✕ إلغاء التعديل</button>
        <button type="submit" class="btn btn-accent" id="saveBtn">📥 حفظ الزيارة</button>
      </div>
    </form>
  </div>

  <div class="card fade-in">
    <div class="card-title" id="listTitle">🔍 سجل الزيارات <span class="badge badge-inspector" id="cnt"></span></div>
    <div class="search-grid">
      <input id="qName" placeholder="بحث بالمعني..." oninput="applySearch()" />
      <input id="qInst" placeholder="بحث بالمؤسسة..." oninput="applySearch()" />
      <input id="qInsp" placeholder="بحث بالمفتش..." oninput="applySearch()" />
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>#</th><th class="cInsp">المفتش</th><th class="cInsp">التخصص</th><th class="cInsp">المرحلة</th><th>المعني</th><th>الرتبة</th><th>الدرجة</th>
        <th>المؤسسة</th><th>التاريخ</th><th>النوع</th><th>النقطة</th><th>العقوبات</th><th>الموسم</th><th>الملاحظة</th><th id="thAct">إجراءات</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table></div>
    <div id="pager" class="pagination"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="core.js"></script>
<script>
  const PER = 10;
  let me, LOCK = false, CAN_ADD, CAN_EDIT, CAN_DEL;
  let ref = { inspectors: [], institutions: [], municipalities: [] };
  let visits = [], filtered = [], page = 1, editId = null;
  const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  const v = id => document.getElementById(id).value.trim();

  // المفتش المرتبط بحساب: المرحلة والاسم والتخصص تُدرج تلقائيًا
  function filterLists() {
    const st = stageSel.value, mn = munSel.value;
    if (!LOCK) {
      fillSelect(inspSel, ref.inspectors.filter(i => i.stage === st).map(i => i.name), '-- اختر المفتش --');
      inspSel.disabled = !st; specialty.value = '';
    }
    fillSelect(instSel, ref.institutions.filter(i => i.stage === st && i.municipality === mn).map(i => i.name), '-- اختر المؤسسة --');
    instSel.disabled = !(st && mn);
  }
  function syncSpecialty() {
    const i = ref.inspectors.find(x => x.name === inspSel.value && x.stage === stageSel.value);
    specialty.value = i ? i.specialty : '';
  }

  async function load(full) {
    showLoader();
    try {
      const d = await listMany(full ? ['visits', 'inspectors', 'institutions', 'municipalities'] : ['visits'], true);
      visits = d.visits.sort((a, b) => (b.visitDate || '').localeCompare(a.visitDate || ''));
      if (full) {
        ref = { inspectors: d.inspectors, institutions: d.institutions, municipalities: d.municipalities };
        const names = ref.municipalities.map(m => m.name).sort((a, b) => a.localeCompare(b, 'ar'));
        noMun.style.display = names.length ? 'none' : 'block';
        fillSelect(munSel, names, '-- اختر البلدية --');
        if (LOCK) { stageSel.value = me.inspector.stage; filterLists(); }
      }
      rankList.innerHTML = [...new Set(visits.map(x => x.rank.trim()).filter(r => r && r !== '-'))]
        .sort((a, b) => a.localeCompare(b, 'ar')).map(r => `<option value="${esc(r)}">`).join('');
      applySearch();
    } catch (e) { showError(e.message); }
    hideLoader();
  }

  function applySearch() {
    const n = qName.value.toLowerCase(), i = qInst.value.toLowerCase(), p = qInsp.value.toLowerCase();
    filtered = visits.filter(x => x.visitee.toLowerCase().includes(n) && x.institution.toLowerCase().includes(i) && x.inspector.toLowerCase().includes(p));
    page = 1; render();
  }

  function render() {
    cnt.textContent = filtered.length + ' زيارة';
    const start = (page - 1) * PER, rows = filtered.slice(start, start + PER), showAct = CAN_EDIT || CAN_DEL;
    const ci = LOCK ? 'style="display:none;"' : '';
    tbody.innerHTML = rows.length ? rows.map((x, k) => `
      <tr><td>${start + k + 1}</td><td ${ci}>${esc(x.inspector)}</td><td ${ci}>${esc(x.specialty)}</td><td ${ci}>${esc(x.stage)}</td>
      <td><strong>${esc(x.visitee)}</strong></td><td>${esc(x.rank) || '-'}</td><td>${esc(x.grade) || '-'}</td>
      <td>${esc(x.institution)}</td><td>${esc(x.visitDate)}</td><td>${esc(x.visitType)}</td>
      <td><span class="badge badge-accent">${esc(x.score) || '-'}</span></td><td>${esc(x.penalty) || 'لا شيء'}</td>
      <td>${esc(x.season)}</td><td class="note-cell">${esc(x.note) || '-'}</td>
      ${showAct ? `<td class="action-btns">${CAN_EDIT ? `<button class="btn btn-primary btn-sm" onclick="edit('${esc(x.id)}')">📝</button>` : ''}
        ${CAN_DEL ? `<button class="btn btn-danger btn-sm" onclick="del('${esc(x.id)}')">🗑️</button>` : ''}</td>` : ''}</tr>`).join('')
      : '<tr><td colspan="15" class="empty-state">لا توجد سجلات مطابقة</td></tr>';
    const pages = Math.max(1, Math.ceil(filtered.length / PER));
    pager.innerHTML = `
      <button class="btn btn-ghost btn-sm" onclick="go(1)" ${page === 1 ? 'disabled' : ''}>البداية</button>
      <button class="btn btn-ghost btn-sm" onclick="go(page-1)" ${page === 1 ? 'disabled' : ''}>السابق</button>
      <strong>${page} / ${pages}</strong>
      <button class="btn btn-ghost btn-sm" onclick="go(page+1)" ${page === pages ? 'disabled' : ''}>التالي</button>
      <button class="btn btn-ghost btn-sm" onclick="go(${pages})" ${page === pages ? 'disabled' : ''}>النهاية</button>`;
  }
  function go(p) { page = p; render(); }

  function resetForm() {
    editId = null; visitForm.reset();
    vDate.value = today(); season.value = seasonLabel(currentSeasonStart());
    if (LOCK) stageSel.value = me.inspector.stage;
    filterLists();
    formTitle.textContent = '✏️ تسجيل زيارة جديدة'; saveBtn.textContent = '📥 حفظ الزيارة'; cancelBtn.style.display = 'none';
    formCard.style.display = CAN_ADD ? '' : 'none';
  }

  function edit(id) {
    const x = visits.find(r => r.id === id); if (!x) return;
    editId = id; formCard.style.display = '';
    stageSel.value = LOCK ? me.inspector.stage : x.stage;
    setSelectValue(munSel, x.municipality); filterLists();
    setSelectValue(instSel, x.institution); instSel.disabled = false;
    if (!LOCK) { setSelectValue(inspSel, x.inspector); inspSel.disabled = false; specialty.value = x.specialty; }
    visitee.value = x.visitee; rank.value = x.rank; grade.value = x.grade;
    setSelectValue(visitType, x.visitType); vDate.value = x.visitDate; setSelectValue(penalty, x.penalty);
    score.value = x.score; setSelectValue(season, x.season); setSelectValue(note, x.note);
    formTitle.textContent = '📝 تعديل بيانات الزيارة'; saveBtn.textContent = '💾 حفظ التعديلات'; cancelBtn.style.display = '';
    scrollTo({ top: 0, behavior: 'smooth' });
  }

  async function del(id) {
    if (!confirm('هل أنت متأكد من حذف هذا السجل نهائيًا؟')) return;
    try { showLoader(); await api('delete', { sheet: 'visits', id }); showSuccess('تم الحذف'); await load(false); }
    catch (e) { showError(e.message); }
    hideLoader();
  }

  visitForm.onsubmit = async e => {
    e.preventDefault();
    const data = {
      stage: LOCK ? me.inspector.stage : v('stageSel'), municipality: v('munSel'), institution: v('instSel'),
      inspector: LOCK ? me.inspector.name : v('inspSel'), specialty: LOCK ? me.inspector.specialty : v('specialty'),
      visitee: v('visitee'), rank: v('rank'), grade: v('grade'), visitType: v('visitType'),
      visitDate: v('vDate'), penalty: v('penalty'), score: v('score'), season: v('season'), note: v('note')
    };
    saveBtn.disabled = true;
    try {
      showLoader();
      await (editId ? api('update', { sheet: 'visits', id: editId, data }) : api('insert', { sheet: 'visits', data }));
      showSuccess(editId ? 'تم تعديل الزيارة' : 'تم حفظ الزيارة');
      resetForm(); await load(false);
    } catch (ex) { showError(ex.message); }
    saveBtn.disabled = false; hideLoader();
  };

  me = initPage(null, ['visits', 'view']);
  if (me) {
    LOCK = !!me.inspector;
    CAN_ADD = can('visits', 'add'); CAN_EDIT = can('visits', 'edit'); CAN_DEL = can('visits', 'delete');
    fillSelect(stageSel, LEVELS, '-- اختر المرحلة --');
    fillSelect(visitType, VISIT_TYPES);
    fillSelect(penalty, PENALTIES);
    fillSelect(note, VISIT_NOTES);
    const y = currentSeasonStart();
    fillSelect(season, [y, y - 1, y - 2].map(seasonLabel));
    stageSel.onchange = munSel.onchange = filterLists;
    inspSel.onchange = syncSpecialty;
    if (!CAN_EDIT && !CAN_DEL) thAct.style.display = 'none';
    if (LOCK) {
      // الحساب مبني على المفتش: لا يختار اسمه ولا مرحلته ولا تخصصه
      gStage.style.display = gInsp.style.display = gSpec.style.display = 'none';
      inspSel.required = false; qInsp.style.display = 'none';
      document.querySelectorAll('.cInsp').forEach(e => e.style.display = 'none');
      whoCard.style.display = '';
      whoName.textContent = me.inspector.name;
      whoMeta.textContent = `مفتش التعليم ${me.inspector.stage}` + (me.inspector.specialty ? ` — التخصص: ${me.inspector.specialty}` : '') + (me.inspector.rank ? ` — ${me.inspector.rank}` : '');
      listTitle.firstChild.textContent = '🔍 سجل زياراتي ';
    }
    resetForm();
    load(true);
  }
</script>
</body>
</html>
